<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Snake-Animation</title>
    <style>
      body {
        margin: 0;
        background: #050505;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Montserrat", sans-serif;
        overflow: hidden;
      }
      .snake-path {
        position: absolute;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: url(#gradient);
        stroke-width: 4;
        stroke-dasharray: 400;
        animation: moveSnake 5s linear infinite;
      }
      @keyframes moveSnake {
        to {
          stroke-dashoffset: -1000;
        }
      }
      .content {
        z-index: 2;
        text-align: center;
      }
      h1 {
        font-size: 5rem;
        color: #fff;
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }
      p {
        color: #00d2ff;
        font-size: 1.5rem;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <svg class="snake-path" viewBox="0 0 1000 500">
      <defs>
        <linearGradient id="gradient">
          <stop offset="0%" , style="stop-color: rgba(255, 0, 128)"></stop>
          <stop offset="50%" , style="stop-color: rgba(0, 255, 255)"></stop>
          <stop offset="100%" , style="stop-color: rgba(255, 255, 0)"></stop>
        </linearGradient>
      </defs>
      <path d="M0, 250, Q250, 50, 500, 250, T1000, 250"></path>
    </svg>
    <div class="content">
      <h1>ATIQ DEV LOG</h1>
      <p>BUILDING THE FUTURE</p>
    </div>
  </body>
</html>
